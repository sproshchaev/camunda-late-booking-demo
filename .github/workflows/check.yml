name: Check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  process-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - run: ./run.sh
